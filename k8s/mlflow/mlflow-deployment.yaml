# k8s/mlflow/mlflow-deployment.yaml
#
# CORRECTIF OOMKilled :
#   - Utilise l'image officielle ghcr.io/mlflow/mlflow (pas de pip install au démarrage)
#   - Augmente les limites mémoire à 1500Mi (suffisant pour MLflow seul)
#   - initialDelaySeconds réduit car plus de pip install à attendre
#
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow-server
  namespace: default
  labels:
    app: mlflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlflow
  template:
    metadata:
      labels:
        app: mlflow
    spec:
      containers:
      - name: mlflow
        image: ghcr.io/mlflow/mlflow:v2.13.0
        command:
        - mlflow
        - server
        - --backend-store-uri
        - sqlite:////mlflow/mlflow.db
        - --default-artifact-root
        - /mlflow/artifacts
        - --host
        - "0.0.0.0"
        - --port
        - "5000"
        ports:
        - containerPort: 5000
          name: mlflow-ui
        volumeMounts:
        - name: mlflow-storage
          mountPath: /mlflow
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "1"
            memory: "1500Mi"
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 20
          periodSeconds: 10
          failureThreshold: 6
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 40
          periodSeconds: 30
          failureThreshold: 5
      volumes:
      - name: mlflow-storage
        persistentVolumeClaim:
          claimName: mlflow-pvc