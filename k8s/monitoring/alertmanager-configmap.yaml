apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: monitoring
  labels:
    app: alertmanager
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m

    route:
      group_by: ['alertname', 'namespace']
      group_wait: 10s
      group_interval: 10s
      repeat_interval: 1h
      receiver: 'default-webhook'
      routes:
        - match:
            severity: critical
          receiver: 'default-webhook'
          group_wait: 5s
        - match:
            severity: warning
          receiver: 'default-webhook'

    receivers:
      - name: 'default-webhook'
        webhook_configs:
          - url: 'http://localhost:5001/'
            send_resolved: true

    inhibit_rules:
      - source_match:
          severity: 'critical'
        target_match:
          severity: 'warning'
        equal: ['alertname', 'namespace']